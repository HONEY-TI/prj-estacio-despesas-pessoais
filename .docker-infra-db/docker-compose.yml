services:
  mariadb:
    build:
      no_cache: true
    container_name: mariadb-container
    hostname: mariadb
    image: mariadb:10.3.39
    restart: always
    environment:
        TZ: America/Sao_Paulo
        MARIADB_ROOT_PASSWORD: "12345!"
        MARIADB_USER: docker
        MARIADB_PASSWORD: docker
        MARIADB_DATABASE: DespesasPessoaisDB
        LANG: C.UTF-8
    ports:
        - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql        
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p12345!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - mariadb-network

volumes:
  mariadb-data:
    name: mariadb-data

networks:
  mariadb-network:
    driver: bridge
    name: mariadb-network
